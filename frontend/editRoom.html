<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="register-container">

        <h2>Edit Room</h2>

        <form id="editRoomForm">

            <input type="text" id="title" placeholder="Room Title" required>

            <input type="text" id="location" placeholder="Location" required>

            <input type="number" id="rent" placeholder="Monthly Rent" required>

            <input type="text" id="roomType" placeholder="Room Type" required>

            <input type="text" id="ownerName" placeholder="Owner Name" required>

            <input type="text" id="ownerPhone" placeholder="Owner Phone" required>

            <textarea id="description"
                placeholder="Description"></textarea>

            <button type="submit">

                Save Changes

            </button>

        </form>

    </div>

    <script src="js/editRoom.js"></script>

</body>

</html>
