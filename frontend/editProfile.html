<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Happy Homes</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="register-container">

    <h2>Edit Profile</h2>

    <form id="editProfileForm">

        <input type="text" id="name" placeholder="Full Name" title="Full Name" required>

        <input type="text" id="phone" placeholder="Phone Number" title="Phone Number" required>

        <input type="text" id="college" placeholder="College Name" title="College Name" required>

        <input type="number" id="budget" placeholder="Monthly Budget" title="Monthly Budget" required>

        <select id="foodPreference" title="Food Preference">

            <option>Vegetarian</option>
            <option>Non-Vegetarian</option>
            <option>Vegan</option>

        </select>

        <button type="submit">

            Save Changes

        </button>

    </form>

</div>

<script src="js/editProfile.js"></script>

</body>
</html>
