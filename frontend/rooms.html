<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms | Happy Homes</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h2>Happy Homes</h2>
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="addRoom.html">Add Room</a></li>
              <li><a href="roommate.html">Roommate</a></li>
              <li><a href="addRoommate.html">Add as Roommate</a></li>
              <li><a href="orders.html">Orders</a></li>
              <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <section class="rooms">

     <h1>Available Rooms</h1>
          
     <div class="filter-container">

        <input
            type="text"
            id="locationFilter"
            placeholder="Search by Location">
    
        <select id="typeFilter" title="typeFilter">
    
            <option value="">All Room Types</option>
    
            <option value="Single">Single</option>
    
            <option value="Double">Double</option>
    
            <option value="Triple">Triple</option>
    
            <option value="PG">PG</option>
    
        </select>
    
        <input
            type="number"
            id="budgetFilter"
            placeholder="Maximum Budget">

        <button onclick="filterRooms()"> Search </button>
     </div>
        <div class="room-container" id="roomContainer"></div> 
    </section>
 <script src="js/script.js"></script>
</body>
</html>
